<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#003399">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Isa Vital | Cloud</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ESTILOS (Mismo diseño Isa Vital 4.0) */
        :root {
            --primary: #003399; --accent: #FF6600; --white: #FFFFFF; --bg: #F0F2F5;
            --text-main: #111827; --text-sec: #6B7280;
            --tag-osef-bg: #FFF7ED; --tag-osef-txt: #9A3412;
            --tag-pfa-bg: #EFF6FF; --tag-pfa-txt: #1E40AF;
            --tag-money-bg: #ECFDF5; --tag-money-txt: #065F46;
            --tag-alert-bg: #FEF2F2; --tag-alert-txt: #991B1B;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); margin: 0; padding-bottom: 95px; overscroll-behavior-y: none; user-select: none; }

        header { background: var(--white); padding: 15px 20px; position: sticky; top: 0; z-index: 50; box-shadow: 0 1px 10px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; padding-top: max(15px, env(safe-area-inset-top)); }
        .logo { font-size: 1.3rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 6px; }
        .logo span { color: var(--accent); }
        .status-dot { width: 10px; height: 10px; background: #ccc; border-radius: 50%; transition: background 0.3s; }
        .status-dot.online { background: #10B981; box-shadow: 0 0 5px #10B981; }

        .container { padding: 15px; max-width: 600px; margin: 0 auto; display: none; animation: fadeIn 0.3s; }
        .container.active { display: block; }
        .card { background: var(--white); border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); border: 1px solid rgba(0,0,0,0.04); }

        /* STOCK */
        .inv-row { display: flex; justify-content: space-between; align-items: center; }
        .inv-controls { display: flex; align-items: center; gap: 8px; background: #F3F4F6; padding: 4px; border-radius: 12px; }
        .inv-btn { width: 32px; height: 32px; border: none; background: white; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); font-weight: bold; color: var(--primary); display:flex; align-items:center; justify-content:center;}
        .inv-val { font-weight: 700; width: 35px; text-align: center; border:none; background:transparent; font-size: 1rem; }

        /* GESTIÓN */
        .filter-bar { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .filter-btn { border: 1px solid #E5E7EB; background: white; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; color: var(--text-sec); white-space: nowrap; cursor: pointer; transition: all 0.2s; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        .tag { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; display: inline-block; margin-bottom: 8px;}
        .tag.osef { background: var(--tag-osef-bg); color: var(--tag-osef-txt); }
        .tag.pfa { background: var(--tag-pfa-bg); color: var(--tag-pfa-txt); }
        .tag.reintegro { background: var(--tag-money-bg); color: var(--tag-money-txt); }
        .tag.reclamo { background: var(--tag-alert-bg); color: var(--tag-alert-txt); }

        .order-card { border-left: 4px solid transparent; }
        .order-card.osef { border-left-color: var(--accent); }
        .order-card.pfa { border-left-color: var(--primary); }
        .order-card.reintegro { border-left-color: #10B981; }
        .order-card.reclamo { border-left-color: #EF4444; }

        /* AGENDA */
        .turn-item { display: flex; align-items: center; gap: 15px; }
        .turn-date { background: #EEF2FF; color: var(--primary); padding: 8px 12px; border-radius: 12px; text-align: center; min-width: 60px; }
        .turn-day { font-size: 1.2rem; font-weight: 700; display: block; line-height: 1; }
        .turn-month { font-size: 0.7rem; text-transform: uppercase; font-weight: 600; }

        /* NAV & MODAL */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.98); border-top: 1px solid #E5E7EB; display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; padding-bottom: max(15px, env(safe-area-inset-bottom)); }
        .nav-item { border: none; background: none; display: flex; flex-direction: column; align-items: center; color: #9CA3AF; font-size: 0.65rem; gap: 4px; cursor: pointer; width: 25%; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active span.material-icons-round { color: var(--accent); transform: translateY(-2px); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal-box { background: white; width: 85%; max-width: 320px; padding: 25px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); text-align: center; }
        .modal-btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span class="material-icons-round" style="color:var(--accent);">favorite</span>Isa<span>Vital</span></div>
        <div style="display:flex; align-items:center; gap:10px;">
            <div id="connectionStatus" class="status-dot"></div>
            <div style="width:32px; height:32px; background:#EEF2FF; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--primary); font-weight:bold; font-size:0.8rem;">IG</div>
        </div>
    </header>

    <div id="tab-stock" class="container active">
        <h4 style="color:var(--text-sec); font-size:0.75rem; margin:15px 5px; font-weight:700;">INSUMOS T1D</h4>
        <div id="stock-list">
            <div style="text-align:center; padding:20px; color:#999;">Cargando stock de la nube...</div>
        </div>
    </div>

    <div id="tab-gestion" class="container">
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterGestion('all', this)">Todos</button>
            <button class="filter-btn" onclick="filterGestion('osef', this)">OSEF</button>
            <button class="filter-btn" onclick="filterGestion('pfa', this)">PFA</button>
            <button class="filter-btn" onclick="filterGestion('reintegro', this)">Reintegros</button>
            <button class="filter-btn" style="color:var(--tag-alert-txt); border-color:#FECACA;" onclick="filterGestion('reclamo', this)">Reclamos</button>
        </div>
        
        <button onclick="addReintegroUI()" style="width:100%; padding:10px; margin-bottom:15px; border:2px dashed #10B981; color:#10B981; background:#F0FDF4; border-radius:12px; font-weight:600; cursor:pointer;">+ Nuevo Gasto / Reintegro</button>

        <div id="orders-list">
             <div style="text-align:center; padding:20px; color:#999;">Cargando pedidos...</div>
        </div>
    </div>

    <div id="tab-agenda" class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h4 style="margin:0; color:var(--text-sec); font-size:0.75rem; font-weight:700;">PRÓXIMOS TURNOS</h4>
            <button onclick="addTurnoUI()" style="color:var(--primary); font-weight:700; background:none; border:none;">+ Agendar</button>
        </div>
        <div id="turnos-list">
             <div style="text-align:center; padding:20px; color:#999;">Cargando agenda...</div>
        </div>
    </div>

    <div id="tab-equipo" class="container">
        <h4 style="color:var(--text-sec); font-size:0.75rem; margin:15px 5px; font-weight:700;">DIRECTORIO MÉDICO</h4>
        <div id="medicos-list">
            <div style="text-align:center; padding:20px; color:#999;">Cargando equipo...</div>
        </div>
    </div>

    <div id="modalProvider" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin-top:0;">¿Para quién es el pedido?</h3>
            <p id="modalItemName" style="color:#666; font-size:0.9rem; margin-bottom:20px; font-weight:bold;">Insumo</p>
            <button class="modal-btn" style="background:#FFF7ED; color:#9A3412;" onclick="confirmOrder('OSEF')"><span class="material-icons-round">local_pharmacy</span> OSEF TDF</button>
            <button class="modal-btn" style="background:#EFF6FF; color:#1E40AF;" onclick="confirmOrder('PFA')"><span class="material-icons-round">security</span> Policía Federal</button>
            <button class="modal-btn" style="background:#F3F4F6; color:#374151;" onclick="closeModal()">Cancelar</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('tab-stock', this)"><span class="material-icons-round">inventory_2</span><span>Stock</span></button>
        <button class="nav-item" onclick="switchTab('tab-gestion', this)"><span class="material-icons-round">assignment</span><span>Gestión</span></button>
        <button class="nav-item" onclick="switchTab('tab-agenda', this)"><span class="material-icons-round">event</span><span>Agenda</span></button>
        <button class="nav-item" onclick="switchTab('tab-equipo', this)"><span class="material-icons-round">people</span><span>Equipo</span></button>
    </nav>

    <script>
        // === 1. CONFIGURACIÓN SUPABASE ===
        const SUPABASE_URL = 'https://bypjrmgemgboivfbnxgi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5cGpybWdlbWdib2l2ZmJueGdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4Mjg0MzAsImV4cCI6MjA4MzQwNDQzMH0.EuzWicGSNSMbzIPwoQW1iSMc8BLhmdQPOZoNhf7bW1U';
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY);

        // === 2. INICIO Y CARGA DE DATOS ===
        async function loadData() {
            // Indicador Online
            document.getElementById('connectionStatus').classList.add('online');

            // Cargar Stock
            const { data: stock } = await db.from('insumos').select('*').order('id');
            renderStock(stock);

            // Cargar Pedidos
            const { data: pedidos } = await db.from('pedidos').select('*').order('id', { ascending: false });
            renderPedidos(pedidos);

            // Cargar Turnos
            const { data: turnos } = await db.from('turnos').select('*').order('id', { ascending: false });
            renderTurnos(turnos);

            // Cargar Médicos
            const { data: medicos } = await db.from('medicos').select('*');
            renderMedicos(medicos);
        }
        
        window.onload = loadData; // Ejecutar al iniciar

        // === 3. RENDERIZADO (DIBUJAR EN PANTALLA) ===
        
        function renderStock(items) {
            const list = document.getElementById('stock-list');
            list.innerHTML = '';
            if(!items || items.length === 0) list.innerHTML = '<p style="text-align:center">No hay insumos</p>';
            
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div class="inv-row">
                        <div><h3 style="margin:0; color:var(--primary); font-size:1rem;">${item.nombre}</h3><p style="margin:0; font-size:0.75rem; color:#666;">${item.detalle}</p></div>
                        <div class="inv-controls">
                            <button class="inv-btn" onclick="updateDBStock(${item.id}, ${item.cantidad - 1})">-</button>
                            <input type="number" class="inv-val" value="${item.cantidad}" readonly>
                            <button class="inv-btn" onclick="updateDBStock(${item.id}, ${item.cantidad + 1})">+</button>
                        </div>
                    </div>
                    <div style="text-align:right; margin-top:10px;">
                        <button onclick="openProviderModal('${item.nombre}')" style="color:var(--accent); background:none; border:none; font-weight:600; cursor:pointer; font-size:0.8rem;">Pedir Insumo &rarr;</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function renderPedidos(items) {
            const list = document.getElementById('orders-list');
            list.innerHTML = '';
            
            if(!items) return;

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = `card order-card ${item.categoria}`;
                div.dataset.cat = item.categoria;
                
                let extraHtml = '';
                if(item.categoria === 'reintegro') {
                    extraHtml = `
                    <div style="background:#ECFDF5; padding:8px; border-radius:8px; margin-top:5px; font-size:0.8rem; color:#064E3B;">
                        <div>Costo: <strong>${item.costo || '$0'}</strong></div>
                        <div>Factura: ${item.tiene_factura ? '✅' : '❌'} | Receta: ${item.tiene_receta ? '✅' : '❌'}</div>
                    </div>`;
                }

                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between;">
                        <span class="tag ${item.categoria}">${item.proveedor}</span>
                        <span style="font-size:0.7rem; color:#666;">${item.fecha}</span>
                    </div>
                    <h3 style="margin:5px 0; font-size:1rem;">${item.titulo}</h3>
                    ${extraHtml}
                    <div class="order-status">
                        <span style="color:var(--primary); font-weight:600; font-size:0.85rem;">${item.estado}</span>
                        <button style="border:none; background:none; color:#999; font-size:0.7rem;">...</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function renderTurnos(items) {
            const list = document.getElementById('turnos-list');
            list.innerHTML = '';
            if(!items) return;
            
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card turn-item';
                div.innerHTML = `
                    <div class="turn-date">
                        <span class="turn-day">${item.dia}</span>
                        <span class="turn-month">${item.mes}</span>
                    </div>
                    <div>
                        <h3 style="margin:0; font-size:1rem; color:var(--text-main);">${item.profesional}</h3>
                        <p style="margin:0; font-size:0.8rem; color:var(--text-sec);">${item.detalle}</p>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function renderMedicos(items) {
            const list = document.getElementById('medicos-list');
            list.innerHTML = '';
            
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div style="display:flex; gap:15px; align-items:center; margin-bottom:15px;">
                        <div style="width:48px; height:48px; background:#EEF2FF; border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--primary);"><span class="material-icons-round">medical_services</span></div>
                        <div><h3 style="margin:0; font-size:1rem; color:var(--primary);">${item.nombre}</h3><p style="margin:0; font-size:0.8rem; color:var(--text-sec);">${item.especialidad}</p></div>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <button onclick="window.open('https://wa.me/549${item.telefono}', '_blank')" style="padding:10px; background:var(--bg); border:none; border-radius:8px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:5px;"><span class="material-icons-round" style="color:#25D366; font-size:18px;">chat</span> WhatsApp</button>
                        <button onclick="window.location.href='tel:${item.telefono}'" style="padding:10px; background:var(--bg); border:none; border-radius:8px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:5px;"><span class="material-icons-round" style="color:var(--primary); font-size:18px;">call</span> Llamar</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // === 4. LÓGICA DE ACTUALIZACIÓN (DB) ===

        async function updateDBStock(id, newQty) {
            if(newQty < 0) return;
            // Actualizar DB
            await db.from('insumos').update({ cantidad: newQty }).eq('id', id);
            // Recargar visual
            loadData(); 
        }

        // === 5. AGREGAR COSAS NUEVAS (UI + DB) ===
        
        let pendingItemName = '';
        function openProviderModal(itemName) {
            pendingItemName = itemName;
            document.getElementById('modalItemName').innerText = itemName;
            document.getElementById('modalProvider').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modalProvider').style.display = 'none'; }

        async function confirmOrder(provider) {
            closeModal();
            const tagClass = provider === 'OSEF' ? 'osef' : 'pfa';
            
            // Guardar en Supabase
            await db.from('pedidos').insert([{
                titulo: `Pedido: ${pendingItemName}`,
                proveedor: provider,
                categoria: tagClass,
                estado: 'Iniciado',
                fecha: new Date().toISOString().split('T')[0]
            }]);
            
            // Cambiar pestaña y recargar
            switchTab('tab-gestion', document.querySelectorAll('.nav-item')[1]);
            loadData();
        }

        async function addReintegroUI() {
            const titulo = prompt("¿Qué compraste? (Ej: Consulta Médica)");
            const costo = prompt("¿Cuánto costó? (Ej: $25000)");
            
            if(titulo && costo) {
                await db.from('pedidos').insert([{
                    titulo: titulo,
                    proveedor: 'Reintegro',
                    categoria: 'reintegro',
                    estado: 'A Presentar',
                    costo: costo,
                    tiene_factura: false,
                    tiene_receta: false,
                    fecha: new Date().toISOString().split('T')[0]
                }]);
                loadData();
            }
        }

        async function addTurnoUI() {
            const profesional = prompt("Profesional:");
            const dia = prompt("Día (Número):");
            const mes = prompt("Mes (Ej: MAR):");
            
            if(profesional && dia) {
                await db.from('turnos').insert([{
                    dia: dia, mes: mes, profesional: profesional, detalle: 'Pendiente'
                }]);
                loadData();
            }
        }

        // === 6. UTILIDADES UI ===
        function switchTab(tabId, btn) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            btn.classList.add('active');
            window.scrollTo(0,0);
        }

        function filterGestion(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const cards = document.querySelectorAll('.order-card');
            cards.forEach(c => {
                if(cat === 'all' || c.dataset.cat === cat) c.style.display = 'block';
                else c.style.display = 'none';
            });
        }
    </script>
</body>
</html>
